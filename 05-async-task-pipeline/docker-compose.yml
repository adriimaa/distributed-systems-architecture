services:
  # Servicio de Redis
  redis:
    image: redis:alpine
    container_name: redis_container
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Base de datos MariaDB
  mariadb:
    image: mariadb:latest
    container_name: mariadb_P5_db
    environment:
      - MYSQL_ROOT_PASSWORD=root_pass
      - MYSQL_DATABASE=P5_db
      - MYSQL_USER=tarea_user
      - MYSQL_PASSWORD=tarea_pass
    volumes:
      - ./basedatos:/var/lib/mysql
    restart: unless-stopped

  # Worker Servidor de Procesamiento
  server:
    container_name: server_container
    restart: on-failure
    build:
      context: ./backend
      dockerfile: Dockerfile_servidor
    environment:
      - REDIS_HOST=redis
      - SQLALCHEMY_DATABASE_URI=mysql+pymysql://tarea_user:tarea_pass@mariadb/P5_db
    volumes:
      - ./backend/static:/app/static
    depends_on:
      - redis
      - mariadb

  # API Flask
  api:
    container_name: api_container
    restart: on-failure
    build:
      context: ./backend
      dockerfile: Dockerfile_api
    environment:
      - REDIS_HOST=redis
      - SQLALCHEMY_DATABASE_URI=mysql+pymysql://tarea_user:tarea_pass@mariadb/P5_db
    volumes:
      - ./backend/static:/app/static
    depends_on:
      - redis
      - mariadb

  # Proxy inverso NGINX
  nginx:
    image: nginx:alpine
    container_name: nginx_container
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    restart: unless-stopped
